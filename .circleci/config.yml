# Generated by circleci config generate
version: "2.1"

orbs:
  node: circleci/node@7.2.1 # registry orb import

commands:
  greet: # command name
    parameters:
      to:
        type: string
        default: "GREATEST ORB"
    steps:
      - run: echo "It's me, the INLINE << parameters.to >>"

jobs:
  hello-job:
    docker:
      - image: cimg/node:20.19.0
    steps:
      - checkout
      - run:
          name: Greeting
          command: echo "Hello there!"
  hello-orb:
    docker:
      - image: cimg/base:current
    steps:
      - greet:
          to: "special delivery from inline orb"

  orbUse: # registry orb use
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
  build:
    docker:
      - image: cimg/node:20.19.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Linting process
          command: cd know && npm run build
  linting:
    docker:
      - image: cimg/node:20.19.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Linting process
          command: cd know && npm run lint
  testing:
    docker:
      - image: cimg/node:20.19.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Testing process
          command: cd know && npm test

workflows:
  my-workflow:
    jobs:
      - hello-job
      - hello-orb
      - orbUse
      - build
      - linting
      - testing
