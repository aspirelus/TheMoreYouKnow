# Generated by circleci config generate
version: "2.1"

orbs:
  node: circleci/node@7.2.1 # registry orb import

commands:
  greet: # command name
    parameters:
      to:
        type: string
        default: "GREATEST ORB"
    steps:
      - run: echo "It's me, the INLINE << parameters.to >>"

jobs:
  hello-job:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - run:
          name: Greeting
          command: echo "Hello there!"
  hello-orb:
    docker:
      - image: cimg/base:current
    steps:
      - greet:
          to: "special delivery from inline orb"

  orbUse: # registry orb use
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
  build:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Linting process
          command: cd know && npm run build
  linting:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Linting process
          command: cd know && npm run lint
  testing:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Testing process
          command: cd know && npm test
  circleci-testing:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run tests
          command: circleci testsuite run "ci tests"
      - store_test_results:
          # Must match outputs.junit in test-suites.yml
          path: test-reports

workflows:
  my-workflow:
    jobs:
      - hello-job
      - hello-orb
      - orbUse:
          requires:
            - hello-orb
      - build
      - linting:
          requires:
            - build
      - testing:
          requires:
            - build
            - linting
      - hold:
          type: approval
          requires:
            - testing
      - circleci-testing:
          requires:
            - hold
      # - deploy:
      #   requires:
      #     - hold
