# Generated by circleci config generate
version: "2.1"

orbs:
  node: circleci/node@5.0.3 # registry orb import

commands:
  greet: # command name
    parameters:
      to:
        type: string
        default: "GREATEST ORB"
    steps:
      - run: echo "It's me, the INLINE << parameters.to >>"

jobs:
  hello-job:
    docker:
      - image: cimg/node:17.2.0
    steps:
      - checkout
      - run:
          name: build
          command: echo "Hello there!"

  hello-orb:
    docker:
      - image:cimg/base:current
    steps:
      - greet:
          to: "special delivery from inline orb"

  orbUse-job: # registry orb use
    executor: node/default
    steps:
      - checkout
      - node/install-packages

workflows:
  my-workflow:
    jobs:
      - hello-job
      - hello-orb
      - orbUse-job
