# Generated by circleci config generate
version: "2.1"

orbs:
  node: circleci/node@7.2.1 # registry orb import

commands:
  greet: # command name
    parameters:
      to:
        type: string
        default: "GREATEST ORB"
    steps:
      - run: echo "It's me, the INLINE << parameters.to >>"

jobs:
  hello-job:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - run:
          name: Greeting
          command: echo "Hello there!"
  hello-orb:
    docker:
      - image: cimg/base:current
    steps:
      - greet:
          to: "special delivery from inline orb"

  orbUse: # registry orb use
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
  build:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Linting process
          command: cd know && npm run build
  linting:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Linting process
          command: cd know && npm run lint
  testing:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Testing process
          command: cd know && npm test
  circleci-deploy:
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout
      - node/install-packages:
          app-dir: know
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan \
              --environment-name="production" \
              --component-name="TheMoreYouKnow" \
              --target-version="1.0.0"
      # Your job here doing the actual deployment
      - run:
          name: Update a deploy to SUCCESS
          command: circleci run release update --status=SUCCESS
          when: on_success
      - run:
          name: Update planned deploy to FAILED
          command: circleci run release update --status=FAILED
          when: on_fail
  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build, smoke-test, and publish to GHCR
          command: |
            set -euo pipefail

            IMAGE=ghcr.io/aspirelus/themoreyouknow
            TAG="$CIRCLE_SHA1"

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

            docker build --pull \
              --label org.opencontainers.image.source=https://github.com/aspirelus/TheMoreYouKnow \
              --tag "$IMAGE:$TAG" \
              .

            docker run -d --name app-smoke-test "$IMAGE:$TAG"
            trap 'docker logs app-smoke-test 2>/dev/null || true; docker rm -f app-smoke-test 2>/dev/null || true' EXIT

            ready=false
            for i in $(seq 1 10); do
              if docker exec app-smoke-test wget -qO- http://127.0.0.1/ > /tmp/app.html; then
                ready=true
                break
              fi
              sleep 2
            done

            test "$ready" = true
            grep -q 'id="app"' /tmp/app.html

            docker rm -f app-smoke-test
            trap - EXIT
            docker push "$IMAGE:$TAG"

workflows:
  my-workflow:
    jobs:
      - hello-job
      - hello-orb
      - orbUse:
          requires:
            - hello-orb
      - build
      - linting:
          requires:
            - build
      - testing:
          requires:
            - build
            - linting
      - hold:
          type: approval
          requires:
            - testing
      - circleci-deploy:
          requires:
            - hold
      - deploy:
          requires:
            - circleci-deploy
